name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Start server and run API smoke tests
        run: |
          npm run start &
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:3847/api/health >/dev/null; then
              echo "Server ready"
              break
            fi
            if [ "$i" -eq 45 ]; then
              echo "Server did not become ready"
              exit 1
            fi
            sleep 2
          done
          npm run test:api
